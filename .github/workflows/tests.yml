name: Tests
run-name: Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # SPEC_OPTS keeps the project's own default rake task as the entry point,
      # so CI runs exactly what a contributor runs locally.
      - name: Run specs
        env:
          SPEC_OPTS: --format progress --format RspecJunitFormatter --out test-reports/rspec.xml
        run: bundle exec rake

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results
          path: test-reports/*.xml

      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Specs
          path: test-reports/*.xml
          reporter: java-junit
          fail-on-error: false